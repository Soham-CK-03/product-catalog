name: Validate Catalog

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.md'

jobs:
  validate-yaml:
    name: Validate YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yaml-lint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            $(find . -name "*.yaml" -not -path "./.github/*")

  validate-catalog-structure:
    name: Check required fields in catalog-info.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all catalog-info.yaml have required fields
        run: |
          failed=0
          for f in $(find features -name "catalog-info.yaml"); do
            if ! grep -q "kind:" "$f"; then
              echo "MISSING kind: in $f"
              failed=1
            fi
            if ! grep -q "owner:" "$f"; then
              echo "MISSING owner: in $f"
              failed=1
            fi
            if ! grep -q "lifecycle:" "$f"; then
              echo "MISSING lifecycle: in $f"
              failed=1
            fi
          done
          exit $failed
